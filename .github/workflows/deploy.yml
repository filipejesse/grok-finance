name: Deploy to Firebase

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "tests/**", ".env.example"]
  workflow_dispatch:

concurrency: deploy

permissions:
  contents: read
  id-token: write # Workload Identity Federation (no Google key stored in GitHub)

env:
  PROJECT_ID: my-grok-finance

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This repo is public: never run the report here, logs are visible to anyone.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        run: |
          python -m venv venv
          venv/bin/pip install -q -r requirements.txt
          venv/bin/python -m unittest

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g firebase-tools

      - name: Sync secrets to Secret Manager
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_ITEM_IDS: ${{ secrets.PLUGGY_ITEM_IDS }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          for name in PLUGGY_CLIENT_ID PLUGGY_CLIENT_SECRET PLUGGY_ITEM_IDS GMAIL_ADDRESS GMAIL_APP_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::GitHub secret $name is not set"; exit 1; fi
            printf '%s' "${!name}" | firebase functions:secrets:set "$name" --data-file=- \
              --project "$PROJECT_ID" --non-interactive > /dev/null
            echo "$name synced"
          done

      - name: Deploy functions
        run: firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force

      - name: Destroy unused secret versions
        run: firebase functions:secrets:prune --force --project "$PROJECT_ID" --non-interactive
